dataset:
  env_var: OPENSCAN_DATASET_DIR
  images_dir: .
  positions_csv: positions.csv
  require_consistent_dimensions: true
  output_dir: output

validation:
  allowed_image_extensions: [.jpg, .jpeg, .png, .tif, .tiff]

crop:
  enabled: true
  mode: manual                 # manual | auto_from_masks
  roi_xyxy: [0.25, 0.18, 0.72, 0.88]  # normalized original-image coordinates
  margin_ratio: 0.08
  resize:
    enabled: true
    output_size: [1200, 1200]

mask:
  mode: u2net                 # u2net | background_subtraction | external
  model_env_var: OPENSCAN_U2NET_MODEL
  input_mean: [0.485, 0.456, 0.406]
  input_std: [0.229, 0.224, 0.225]
  alpha_threshold: 0.5
  feather_radius: 1.0
  opening_kernel: 0
  closing_kernel: 3
  min_component_ratio: 0.0002
  keep_largest_component: false
  external_dir: masks
  background_samples: 9
  difference_threshold: 24

debug:
  save_masks: false

quality:
  dark_clip_threshold: 5
  bright_clip_threshold: 250
  warning_sharpness: 17.0
  reject_sharpness: 12.0
  warning_clip_percent: 3.0
  reject_clip_percent: 12.0
  warning_contrast: 25.0
  reject_contrast: 12.0
  override_file: quality_override.csv

preprocessing:
  brightness_normalization:
    enabled: false
    target_mean: 128
  clahe:
    enabled: false
    clip_limit: 2.0
    grid_size: [8, 8]
  highlight_suppression:
    enabled: false
    threshold: 220
    strength: 0.8
  sharpen:
    enabled: false
    amount: 0.5
    radius: 1.0

preview:
  panel_size: [600, 450]
  checker_size: 24

mesh_comparison:
  reference_mesh_env_var: OPENSCAN_REFERENCE_MESH
  reconstruction_mesh_env_var: OPENSCAN_RECONSTRUCTION_MESH

pose:
  convention: object_rotation_z_then_x

evaluation:
  sample_count: 20000
  random_seed: 42
  heatmap_max_mm: 5.0
  rigid_alignment: false
