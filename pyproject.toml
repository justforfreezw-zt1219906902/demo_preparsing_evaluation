[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openscan-eval"
version = "0.1.0"
description = "OpenScan dataset preprocessing and reconstruction evaluation toolkit"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "matplotlib>=3.8",
  "numpy>=1.26",
  "onnxruntime>=1.18",
  "opencv-python-headless>=4.9",
  "Pillow>=10",
  "PyYAML>=6",
  "scipy>=1.12",
  "trimesh>=4.4",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
openscan-eval = "openscan_eval.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
